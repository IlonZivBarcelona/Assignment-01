<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Signup / Login SPA</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title text-center mb-3"> Authentication</h3>

            <!-- Nav buttons -->
            <div class="d-flex justify-content-center mb-3">
              <button id="showSignup" class="btn btn-outline-primary me-2">Signup</button>
              <button id="showLogin" class="btn btn-outline-secondary">Login</button>
            </div>

            <!-- Signup view -->
            <div id="signupView" class="auth-view">
              <form id="signupForm">
                <div class="mb-2">
                  <label class="form-label">First name</label>
                  <input name="firstName" class="form-control" required />
                </div>
                <div class="mb-2">
                  <label class="form-label">Last name</label>
                  <input name="lastName" class="form-control" required />
                </div>
                <div class="mb-2">
                  <label class="form-label">Email</label>
                  <input name="email" type="email" class="form-control" required />
                </div>
                <div class="mb-2">
                  <label class="form-label">Birthdate</label>
                  <input name="birthdate" type="date" class="form-control" required />
                </div>
                <div class="mb-2">
                  <label class="form-label">Password</label>
                  <input name="password" type="password" minlength="6" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Re-password</label>
                  <input name="repassword" type="password" minlength="6" class="form-control" required />
                </div>
                <div class="d-grid">
                  <button class="btn btn-primary">Sign up</button>
                </div>
              </form>
            </div>

            <!-- Login view -->
            <div id="loginView" class="auth-view" style="display:none;">
              <form id="loginForm">
                <div class="mb-2">
                  <label class="form-label">Email</label>
                  <input name="email" type="email" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input name="password" type="password" class="form-control" required />
                </div>
                <div class="d-grid">
                  <button class="btn btn-success">Login</button>
                </div>
              </form>
            </div>

            <!-- Welcome view (after login) -->
            <div id="welcomeView" style="display:none;">
              <h4 id="welcomeText"></h4>
              <p id="welcomeDetails"></p>
              <div class="d-grid">
                <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
              </div>
            </div>

            <div class="mt-3">
              <div id="message" class="text-center"></div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
