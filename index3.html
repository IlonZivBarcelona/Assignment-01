<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Users Generator</title>
  <link rel="stylesheet" href="styles3.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" 
        crossorigin="anonymous">
</head>
<body class="bg-light">
  <div class="container py-5 text-center">
    <h2 class="mb-4"> Ilon's Random Users Generator</h2>
    
    <!-- Input above button -->
    <div class="d-flex flex-column align-items-center mb-3">
      <input type="number" id="userCount" min="0" max="1000" 
             placeholder="Enter number of random users">
      <button class="btn btn-primary mt-3" onclick="fetchUsers()">Generate</button>
    </div>
    
    <!-- Error -->
    <div id="error"></div>
    
    <!-- Table -->
    <div class="table-responsive">
      <table id="userTable" class="table"></table>
    </div>
  </div>

  <script src="script3.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" 
          crossorigin="anonymous"></script>
</body>
</html>
